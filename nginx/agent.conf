server {
    listen 80;
    server_name agent.dubaivpn.xyz;

    real_ip_header CF-Connecting-IP;
    client_max_body_size 50m;

    location = /health {
        proxy_pass http://agent:8080/health;
        access_log off;
    }

    location / {
        proxy_pass http://agent:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Cloudflare's "Full" / "Full (strict)" SSL modes connect to the origin over
# HTTPS. The cert here is self-signed - fine for Full (Cloudflare doesn't
# validate the origin chain), NOT valid for Full (strict). Use Flexible or
# Full mode in the Cloudflare dashboard for this domain.
server {
    listen 443 ssl;
    server_name agent.dubaivpn.xyz;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    real_ip_header CF-Connecting-IP;
    client_max_body_size 50m;

    location = /health {
        proxy_pass http://agent:8080/health;
        access_log off;
    }

    location / {
        proxy_pass http://agent:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
